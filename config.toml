baseURL = 'https://goodinfo.net/'
languageCode = 'zh-cn'
title = '全球全景日报 | goodinfo.net'
theme = 'hugo-PaperMod'
enableRobotsTXT = true
defaultContentLanguage = 'zh'

[pagination]
  pagerSize = 10

[languages]
  [languages.zh]
    languageCode = 'zh-cn'
    languageName = '中文'
    contentDir = 'content'
    title = '全球全景日报 | goodinfo.net'
    weight = 1
    [languages.zh.params]
      description = 'AI 驱动的全球新闻过滤器 — 每小时自动聚合 AI科技、财经、国际、科学、Crypto 五大领域精选资讯。'
      homeInfoParams = { Title = '🌍 goodinfo.net 全球全景日报', Content = 'AI 驱动的全球新闻过滤器 — 每小时自动聚合 AI科技、财经、国际、科学、Crypto 五大领域精选资讯。无广告、无噪音，只看真正重要的事。' }

  [languages.en]
    languageCode = 'en'
    languageName = 'English'
    contentDir = 'content.en'
    title = 'goodinfo.net Daily'
    weight = 2
    [languages.en.params]
      description = 'goodinfo.net daily curated global news: AI, tech, finance, and world affairs.'
      homeInfoParams = { Title = '🌍 goodinfo.net Daily', Content = 'AI-powered global news filter — hourly curated insights across AI, Finance, World, Science & Crypto. No ads, no noise, only what matters.' }

