baseURL = 'https://goodinfo.net/'
languageCode = 'zh-cn'
title = '全球全景日报 | GoodInfo'
theme = 'hugo-PaperMod'
enableRobotsTXT = true
defaultContentLanguage = 'zh'

[pagination]
  pagerSize = 10

[languages]
  [languages.zh]
    languageCode = 'zh-cn'
    languageName = '中文'
    contentDir = 'content'
    title = '全球全景日报 | GoodInfo'
    weight = 1
    [languages.zh.params]
      description = 'GoodInfo 每日精选全球资讯：AI、科技、财经、国际新闻。'
      homeInfoParams = { Title = '📅 全球全景日报', Content = 'GoodInfo 每日自动抓取的全球热点，涵盖 AI 前沿、国际风云、科技财经与科学探索。' }

  [languages.en]
    languageCode = 'en'
    languageName = 'English'
    contentDir = 'content.en'
    title = 'GoodInfo Daily'
    weight = 2
    [languages.en.params]
      description = 'GoodInfo daily curated global news: AI, tech, finance, and world affairs.'
      homeInfoParams = { Title = '📅 GoodInfo Daily', Content = 'GoodInfo auto-curated global hot topics covering AI frontier, world affairs, tech finance, and scientific exploration.' }

[[languages.zh.menu.main]]
  identifier = 'ai-tech'
  name = '🤖 AI与科技'
  url = '/categories/ai-tech/'
  weight = 10

[[languages.zh.menu.main]]
  identifier = 'finance'
  name = '💰 财经'
  url = '/categories/finance/'
  weight = 20

[[languages.zh.menu.main]]
  identifier = 'world'
  name = '🌍 国际'
  url = '/categories/world/'
  weight = 30

[[languages.zh.menu.main]]
  identifier = 'science'
  name = '🔬 科学'
  url = '/categories/science/'
  weight = 40

[[languages.zh.menu.main]]
  identifier = 'archive'
  name = '📰 全部归档'
  url = '/posts/'
  weight = 50

[[languages.en.menu.main]]
  identifier = 'ai-tech'
  name = '🤖 AI & Tech'
  url = '/en/categories/ai-tech/'
  weight = 10

[[languages.en.menu.main]]
  identifier = 'finance'
  name = '💰 Finance'
  url = '/en/categories/finance/'
  weight = 20

[[languages.en.menu.main]]
  identifier = 'world'
  name = '🌍 World'
  url = '/en/categories/world/'
  weight = 30

[[languages.en.menu.main]]
  identifier = 'science'
  name = '🔬 Science'
  url = '/en/categories/science/'
  weight = 40

[[languages.en.menu.main]]
  identifier = 'archive'
  name = '📰 Archive'
  url = '/en/posts/'
  weight = 50

[params]
  author = 'GoodInfo'
  DateFormat = '2006-01-02 15:04'
  defaultTheme = 'auto'
  ShowToc = true
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  ShowReadingTime = true
  displayFullLangName = true

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
