[params]
  author = 'goodinfo.net'
  DateFormat = '2006-01-02 15:04'
  defaultTheme = 'auto'
  ShowToc = true
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  ShowReadingTime = false
  displayFullLangName = true
  env = 'production'

  [params.schema]
    publisherType = 'Organization'
    sameAs = ['https://goodinfo.net']

  [params.assets]
    customCSS = ["css/extended/custom.css"]
    favicon = 'favicon.ico'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ['HTML', 'RSS', 'WebAppManifest']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[services]
  [services.rss]
    limit = 50

[minify]
  disableXML = true
