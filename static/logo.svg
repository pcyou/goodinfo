<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Globe with AI filter -->
  <g transform="translate(20, 20)">
    <!-- Globe circle -->
    <circle cx="40" cy="40" r="35" fill="none" stroke="url(#iconGradient)" stroke-width="2.5"/>
    
    <!-- Globe meridians -->
    <ellipse cx="40" cy="40" rx="15" ry="35" fill="none" stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="40" cy="40" rx="28" ry="35" fill="none" stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Globe parallels -->
    <ellipse cx="40" cy="25" rx="32" ry="8" fill="none" stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="40" cy="55" rx="32" ry="8" fill="none" stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.5"/>
    
    <!-- AI/Filter nodes -->
    <circle cx="40" cy="40" r="6" fill="url(#iconGradient)"/>
    <circle cx="25" cy="25" r="3" fill="#3b82f6"/>
    <circle cx="55" cy="25" r="3" fill="#8b5cf6"/>
    <circle cx="25" cy="55" r="3" fill="#06b6d4"/>
    <circle cx="55" cy="55" r="3" fill="#3b82f6"/>
    
    <!-- Connection lines -->
    <line x1="40" y1="40" x2="25" y2="25" stroke="url(#iconGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="40" y1="40" x2="55" y2="25" stroke="url(#iconGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="40" y1="40" x2="25" y2="55" stroke="url(#iconGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="40" y1="40" x2="55" y2="55" stroke="url(#iconGradient)" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Text: GoodInfo -->
  <text x="120" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="url(#logoGradient)">
    Good<tspan fill="url(#iconGradient)">Info</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="120" y="95" font-family="Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="1">POWERED GLOBAL NEWS FILTER
  </text>
</svg>